services:
  kidsafe:
    build: .
    container_name: kidsafe
    restart: unless-stopped
    # En Linux se recomienda network_mode: host para ver las IPs reales de los dispositivos.
    # Descomenta la línea de abajo y comenta "ports:" si usas Linux.
    # network_mode: host
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8080:8080/tcp"
    volumes:
      - ./data:/data
    environment:
      - KIDSAFE_DATA=/data
      - KIDSAFE_DNS_PORT=53
      - KIDSAFE_WEB_PORT=8080
      - KIDSAFE_UPSTREAMS=1.1.1.1,8.8.8.8
      - KIDSAFE_RETENTION_DAYS=90
    cap_add:
      - NET_ADMIN
