<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>KidSafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { display:['"Plus Jakarta Sans"','sans-serif'], body:['Inter','sans-serif'] },
    colors: {
      ink:'#0d1117', soft:'#6b7a99', mist:'#f4f6fb', card:'#ffffff',
      brand:'#3d5afe', ok:'#00c896', warn:'#ff9f0a', danger:'#ff3b30',
      line:'#eaecf2'
    }
  }}
}
</script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:Inter,sans-serif;background:#f4f6fb;color:#0d1117;margin:0}
  h1,h2,h3,.display{font-family:'Plus Jakarta Sans',sans-serif}
  .press{transition:transform .12s,opacity .12s;cursor:pointer;-webkit-user-select:none;user-select:none}
  .press:active{transform:scale(.96);opacity:.85}
  .tab-active{color:#3d5afe}
  .tab-active .tdot{opacity:1}
  .fade{animation:fd .22s ease both}
  @keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .tog{width:52px;height:32px;border-radius:99px;background:#dde3ef;position:relative;transition:.22s;cursor:pointer;flex:none;border:none}
  .tog.on{background:#00c896}
  .tog::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:99px;background:#fff;transition:.22s;box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .tog.on::after{left:24px}
  @media(prefers-reduced-motion){.fade,.press,.tog,.tog::after{animation:none;transition:none}}
</style>
</head>
<body class="min-h-screen">
<div id="app" class="max-w-md mx-auto min-h-screen"></div>

<script>
// ── núcleo ──────────────────────────────────────────────────────────────────
const API="";
let TOKEN=localStorage.getItem("ks_token")||"";
let CATS=[];
let WS=null;
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const h=html=>{const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstChild};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY_ES=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];

async function api(path,opts={}){
  const r=await fetch(API+path,{...opts,headers:{"Content-Type":"application/json",...(TOKEN?{"Authorization":"Bearer "+TOKEN}:{}),    ...(opts.headers||{})}});
  if(r.status===401){TOKEN="";localStorage.removeItem("ks_token");route("login");throw new Error("401")}
  if(!r.ok){let m="Error";try{m=(await r.json()).detail||m}catch{};throw new Error(m)}
  if(r.status===204)return null;
  return r.json();
}

function draw(){if(window.lucide)lucide.createIcons()}

function toast(msg,kind="ok"){
  const bg={ok:"#00c896",warn:"#ff9f0a",danger:"#ff3b30"}[kind]||"#0d1117";
  const t=h(`<div style="background:${bg}" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-50 text-white px-5 py-3 rounded-2xl shadow-lg text-sm font-semibold fade whitespace-nowrap">${esc(msg)}</div>`);
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}

function schText(s){
  if(!s)return "Siempre activo";
  const days=s.days;
  let dd;
  if(!days||days.length===7)dd="todos los días";
  else if(JSON.stringify([...days].sort((a,b)=>a-b))===JSON.stringify([0,1,2,3,4]))dd="lun–vie";
  else if(JSON.stringify([...days].sort((a,b)=>a-b))===JSON.stringify([5,6]))dd="fines de semana";
  else dd=days.map(d=>DAY_ES[d]).join(", ");
  return `${s.from||""}–${s.to||""}, ${dd}`;
}

// ── arranque ─────────────────────────────────────────────────────────────────
async function boot(){
  try{
    const st=await fetch(API+"/api/setup/status").then(r=>r.json());
    if(!st.configured)return route("setup");
    if(!TOKEN)return route("login");
    CATS=await api("/api/categories");
    route("home");
  }catch{route("login")}
}
function route(view,arg){
  if(WS&&view!=="home"){try{WS.close()}catch{}WS=null}
  ({setup:Setup,login:Login,home:Home,child:Child,devices:Devices,ajustes:Ajustes}[view]||Home)(arg);
}

// ── shell con 3 pestañas ─────────────────────────────────────────────────────
function shell(content,active,{back,title,action}={}){
  const nav=[["home","Mis hijos","users"],["home","Actividad","activity"],["ajustes","Ajustes","settings"]];
  const header=`<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-line px-5 pt-4 pb-3 flex items-center gap-3">
    ${back?`<button onclick="route('${back}')" class="press -ml-1 p-1.5 rounded-xl">${icon('chevron-left','w-6 h-6')}</button>`:'<div class="w-9"></div>'}
    <h1 class="display font-extrabold text-xl flex-1 text-center tracking-tight">${esc(title||'KidSafe')}</h1>
    ${action||'<div class="w-9"></div>'}
  </header>`;
  const navbar=`<nav class="fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur border-t border-line safe-bottom">
    <div class="max-w-md mx-auto grid grid-cols-3">
      ${nav.map(([k,l,ic],i)=>{
        const act=(i===0&&active==="home")||(i===1&&active==="feed")||(i===2&&active==="ajustes");
        const fn=i===1?`route('home');setTimeout(()=>openFeed(),100)`:`route('${k}')`;
        return`<button onclick="${fn}" class="tab ${act?'tab-active':''} flex flex-col items-center gap-1 py-3 text-soft press">
          <span class="relative">${icon(ic,'w-6 h-6')}<span class="tdot absolute -bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-brand opacity-0"></span></span>
          <span class="text-[11px] font-bold">${l}</span></button>`;
      }).join("")}
    </div></nav>`;
  $("#app").innerHTML=`<div class="pb-32 min-h-screen">${header}<main class="px-5 pt-4 fade">${content}</main></div>${navbar}`;
  draw();
}

const icon=(name,cls="w-5 h-5")=>`<i data-lucide="${name}" class="${cls}"></i>`;

// ── SETUP (wizard) ────────────────────────────────────────────────────────────
let SETUP={step:1,profiles:[]};
const EMOJIS=["🧒","👧","👦","🐯","🦊","🐼","🦄","🐙","🚀","⭐","🐻","🦁"];
const PRESET_LABELS={pequeno:"Pequeño (3–7 años)",nino:"Niño (8–12 años)",adolescente:"Adolescente (13–17 años)"};

function Setup(){
  const steps=4;
  const pct=Math.round((SETUP.step-1)/(steps-1)*100);
  $("#app").innerHTML=`<div class="max-w-md mx-auto min-h-screen px-5 pb-10">
    <div class="pt-8 pb-6 flex items-center gap-3">
      <div class="flex-1 h-1.5 rounded-full bg-line overflow-hidden"><div class="h-full bg-brand rounded-full transition-all duration-500" style="width:${pct}%"></div></div>
      <span class="text-sm font-bold text-soft">${SETUP.step} / ${steps}</span>
    </div>
    <div id="wb"></div>
  </div>`;
  renderStep();
}

function renderStep(){
  const b=$("#wb");b.classList.add("fade");
  if(SETUP.step===1){
    b.innerHTML=`
      <div class="text-center mb-8">
        <div class="text-7xl mb-5">🛡️</div>
        <h2 class="display text-3xl font-black mb-3">Bienvenida a KidSafe</h2>
        <p class="text-soft text-lg leading-relaxed">Crea una contraseña para entrar al panel. Solo tú la necesitarás.</p>
      </div>
      <label class="block text-sm font-bold text-soft mb-1.5 uppercase tracking-wide">Contraseña</label>
      <input id="pw" type="password" placeholder="Mínimo 4 caracteres"
        class="w-full px-4 py-4 text-lg rounded-2xl border-2 border-line bg-white outline-none focus:border-brand mb-3">
      <label class="block text-sm font-bold text-soft mb-1.5 uppercase tracking-wide">Repite la contraseña</label>
      <input id="pw2" type="password" placeholder="Igual que la de arriba"
        class="w-full px-4 py-4 text-lg rounded-2xl border-2 border-line bg-white outline-none focus:border-brand mb-6">
      <button onclick="setupPw()" class="press w-full bg-brand text-white font-black text-lg py-4 rounded-2xl">Continuar →</button>`;
  }else if(SETUP.step===2){
    b.innerHTML=`
      <div class="mb-8">
        <div class="text-5xl mb-4">👨‍👩‍👧‍👦</div>
        <h2 class="display text-3xl font-black mb-2">¿Quiénes son tus hijos?</h2>
        <p class="text-soft text-base">Agrega a cada uno. Después les asignas sus dispositivos.</p>
      </div>
      <div id="kidlist" class="space-y-3 mb-4"></div>
      <button onclick="addKid()" class="press w-full border-2 border-dashed border-line text-soft font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 mb-6">
        ${icon('plus','w-5 h-5')} Agregar hijo
      </button>
      <button onclick="goKids()" class="press w-full bg-brand text-white font-black text-lg py-4 rounded-2xl">Continuar →</button>`;
    if(!SETUP.profiles.length)addKid(); else renderKids();
  }else if(SETUP.step===3){
    b.innerHTML=`
      <div class="mb-8">
        <div class="text-5xl mb-4">📱</div>
        <h2 class="display text-3xl font-black mb-2">Los dispositivos</h2>
        <p class="text-soft text-base">Busca los aparatos conectados a tu red y asígnalos a cada hijo. Los que no asignes no se vigilan.</p>
      </div>
      <button id="scanbtn" onclick="scanDevs()" class="press w-full bg-ink text-white font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 mb-4">
        ${icon('radar','w-5 h-5')} Buscar dispositivos
      </button>
      <div id="devscan" class="space-y-2 mb-6"></div>
      <button onclick="SETUP.step=4;renderStep()" class="press w-full bg-brand text-white font-black text-lg py-4 rounded-2xl">Terminar →</button>`;
  }else{
    b.innerHTML=`
      <div class="text-center pt-4">
        <div class="text-7xl mb-5">✅</div>
        <h2 class="display text-3xl font-black mb-3">¡Listo!</h2>
        <p class="text-soft text-lg leading-relaxed mb-6">Solo falta decirle a tu router que use KidSafe. Es rápido.</p>
        <div class="bg-white rounded-3xl border-2 border-line p-5 text-left mb-6">
          <h3 class="display font-bold text-lg mb-3">Cómo conectar tu red (1 vez)</h3>
          <ol class="space-y-3 text-soft">
            <li class="flex gap-3"><span class="display font-black text-brand text-lg w-6 flex-none">1</span>Entra a la configuración de tu router (suele ser <b class="text-ink">192.168.1.1</b> en el navegador).</li>
            <li class="flex gap-3"><span class="display font-black text-brand text-lg w-6 flex-none">2</span>Busca la sección de <b class="text-ink">Servidor DNS</b>.</li>
            <li class="flex gap-3"><span class="display font-black text-brand text-lg w-6 flex-none">3</span>Pon la dirección IP de tu computadora con KidSafe.</li>
            <li class="flex gap-3"><span class="display font-black text-brand text-lg w-6 flex-none">4</span>Guarda. En unos minutos verás actividad en el panel.</li>
          </ol>
        </div>
        <button onclick="boot()" class="press w-full bg-brand text-white font-black text-xl py-4 rounded-2xl">Ir al panel</button>
      </div>`;
  }
  draw();
}

function addKid(){SETUP.profiles.push({name:"",emoji:EMOJIS[SETUP.profiles.length%EMOJIS.length],preset:"nino"});renderKids()}
function renderKids(){
  const list=$("#kidlist");if(!list)return;list.innerHTML="";
  SETUP.profiles.forEach((k,i)=>{
    const row=h(`<div class="bg-white rounded-2xl border-2 border-line p-4">
      <div class="flex items-center gap-3 mb-3">
        <button class="text-4xl press" onclick="cycleEmoji(${i})" title="Cambiar emoji">${k.emoji}</button>
        <input value="${esc(k.name)}" oninput="SETUP.profiles[${i}].name=this.value" placeholder="Nombre del hijo"
          class="flex-1 text-lg font-bold bg-transparent outline-none border-b-2 border-line focus:border-brand pb-1">
        <button onclick="SETUP.profiles.splice(${i},1);renderKids()" class="press p-2 text-soft">${icon('x','w-5 h-5')}</button>
      </div>
      <div class="grid grid-cols-3 gap-2">
        ${Object.entries(PRESET_LABELS).map(([v,l])=>
          `<button onclick="SETUP.profiles[${i}].preset='${v}';renderKids()"
            class="press text-xs font-bold py-2.5 rounded-xl border-2 ${k.preset===v?'border-brand bg-brand/5 text-brand':'border-line text-soft'}">${l.split(' ')[0]}</button>`).join("")}
      </div></div>`);
    list.appendChild(row);
  });draw();
}
function cycleEmoji(i){const c=EMOJIS.indexOf(SETUP.profiles[i].emoji);SETUP.profiles[i].emoji=EMOJIS[(c+1)%EMOJIS.length];renderKids()}

async function setupPw(){
  const pw=$("#pw").value,pw2=$("#pw2").value;
  if(pw.length<4)return toast("Mínimo 4 caracteres","warn");
  if(pw!==pw2)return toast("Las contraseñas no coinciden","warn");
  try{
    const r=await fetch(API+"/api/setup/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})}).then(x=>x.json());
    TOKEN=r.token;localStorage.setItem("ks_token",TOKEN);SETUP.step=2;renderStep();
  }catch{toast("No se pudo guardar","danger")}
}
async function goKids(){
  const ok=SETUP.profiles.filter(k=>k.name.trim());
  if(!ok.length)return toast("Agrega al menos un hijo","warn");
  SETUP.profiles=ok;
  for(const k of SETUP.profiles){const r=await api("/api/profiles",{method:"POST",body:JSON.stringify(k)});k.id=r.id}
  SETUP.step=3;renderStep();
}
async function scanDevs(){
  $("#scanbtn").textContent="Buscando…";
  try{await api("/api/devices/discover",{method:"POST"})}catch{}
  const devs=await api("/api/devices");
  const box=$("#devscan");
  box.innerHTML=devs.length?devs.map(d=>{
    const opts=`<option value="">Sin asignar</option>`+SETUP.profiles.map(p=>`<option value="${p.id}" ${d.profile_id==p.id?'selected':''}>${esc(p.emoji+" "+p.name)}</option>`).join("");
    return`<div class="bg-white rounded-2xl border-2 border-line p-3 flex items-center gap-3">
      <div class="text-2xl">${icon('smartphone','w-5 h-5 text-soft')}</div>
      <div class="flex-1 min-w-0"><p class="font-bold text-sm truncate">${esc(d.label)}</p><p class="text-xs text-soft">${esc(d.vendor||d.ip)}</p></div>
      <select onchange="api('/api/devices/${d.id}',{method:'PATCH',body:JSON.stringify({profile_id:this.value?parseInt(this.value):null})})" class="text-sm border-2 border-line rounded-xl px-2 py-1.5 bg-white">${opts}</select>
    </div>`;
  }).join(""):
  `<p class="text-center text-soft py-4">No se encontraron dispositivos. Asegúrate de que estén conectados al WiFi y vuelve a buscar.</p>`;
  $("#scanbtn").innerHTML=`${icon('radar','w-5 h-5')} Buscar de nuevo`;draw();
}

// ── LOGIN ────────────────────────────────────────────────────────────────────
function Login(){
  $("#app").innerHTML=`<div class="max-w-md mx-auto min-h-screen px-5 flex flex-col justify-center fade">
    <div class="text-center mb-10"><div class="text-7xl mb-4">🛡️</div>
      <h2 class="display text-3xl font-black mb-2">KidSafe</h2>
      <p class="text-soft text-lg">Ingresa tu contraseña para entrar</p></div>
    <input id="lpw" type="password" placeholder="Tu contraseña"
      class="w-full px-5 py-4 text-xl rounded-2xl border-2 border-line bg-white outline-none focus:border-brand mb-4"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()" class="press w-full bg-brand text-white font-black text-xl py-4 rounded-2xl">Entrar</button>
  </div>`;
  setTimeout(()=>$("#lpw")?.focus(),100);
}
async function doLogin(){
  try{
    const r=await fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#lpw").value})}).then(x=>x.json().then(j=>({ok:x.ok,j})));
    if(!r.ok)return toast(r.j.detail||"Contraseña incorrecta","danger");
    TOKEN=r.j.token;localStorage.setItem("ks_token",TOKEN);boot();
  }catch{toast("Error de conexión","danger")}
}

// ── HOME — mis hijos ──────────────────────────────────────────────────────────
let _feedOpen=false;
async function Home(){
  _feedOpen=false;
  let st;try{st=await api("/api/state")}catch{return}

  const banner=st.new_devices>0
    ?`<button onclick="route('devices')" class="press w-full bg-brand/10 text-brand rounded-2xl px-4 py-3 mb-4 flex items-center gap-2 font-bold text-sm">
        ${icon('sparkles','w-5 h-5')} ${st.new_devices} dispositivo(s) nuevo(s) — toca para asignarlos
      </button>`:""

  const cards=st.children.length
    ?st.children.map(kidCard).join("")
    :`<div class="text-center py-20">
        <div class="text-6xl mb-4">👶</div>
        <p class="text-soft text-lg">Aún no tienes hijos. Agrégalos en Ajustes.</p>
      </div>`;

  shell(banner+`<div class="space-y-4">${cards}</div>`,"home",{title:"Tu hogar"});
  startFeedSilent();
}

function kidCard(c){
  const ok=!c.paused&&c.blocked_today===0;
  const paused=c.paused;
  const status=paused
    ?`<span class="inline-flex items-center gap-1.5 text-warn bg-warn/10 px-3 py-1.5 rounded-full text-xs font-black">${icon('pause','w-3.5 h-3.5')} Pausado</span>`
    :ok
    ?`<span class="inline-flex items-center gap-1.5 text-ok bg-ok/10 px-3 py-1.5 rounded-full text-xs font-black">${icon('check','w-3.5 h-3.5')} Todo bien</span>`
    :`<span class="inline-flex items-center gap-1.5 text-danger bg-danger/10 px-3 py-1.5 rounded-full text-xs font-black">${icon('shield-alert','w-3.5 h-3.5')} ${c.blocked_today} bloqueo${c.blocked_today>1?'s':''}</span>`;
  const top=c.top_sites.length
    ?`<p class="text-sm text-soft mt-2">Visitó: ${c.top_sites.map(s=>`<b class="text-ink">${esc(s.domain)}</b>`).join(", ")}</p>`
    :`<p class="text-sm text-soft mt-2">Sin actividad hoy</p>`;
  return`<button onclick="route('child',${c.id})" class="press w-full text-left bg-white rounded-3xl border-2 border-line p-5 block">
    <div class="flex items-center gap-4">
      <div class="text-4xl w-16 h-16 rounded-2xl bg-mist flex items-center justify-center flex-none">${c.emoji}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <h3 class="display font-black text-xl">${esc(c.name)}</h3>
          ${status}
        </div>
        ${top}
      </div>
    </div>
  </button>`;
}

// feed silencioso para refrescar el home cada 5s
function startFeedSilent(){
  if(WS&&WS.readyState===1)return;
  try{
    const proto=location.protocol==="https:"?"wss":"ws";
    WS=new WebSocket(`${proto}://${location.host}/api/feed/live?token=${TOKEN}`);
    WS.onmessage=()=>{/* silent: solo mantiene la conexión viva */};
    WS.onclose=()=>{WS=null};
  }catch{}
}

// Feed en vivo (se abre desde pestaña Actividad)
let FEED=[];
function openFeed(){
  _feedOpen=true;
  const content=`
    <div class="flex items-center gap-2 text-sm text-soft mb-4">
      <span class="relative flex w-2.5 h-2.5"><span class="animate-ping absolute inset-0 rounded-full bg-ok opacity-60"></span><span class="rounded-full w-2.5 h-2.5 bg-ok"></span></span>
      Escuchando tu red en tiempo real…
    </div>
    <div id="flist" class="bg-white rounded-3xl border-2 border-line p-4 space-y-2 min-h-[55vh]">
      ${FEED.length?FEED.map(feedRow).join(""):'<p class="text-soft text-center py-8">Esperando actividad…</p>'}
    </div>`;
  shell(content,"feed",{title:"Actividad"});
  connectFeedWS();
}
function feedRow(q){
  const c=CATS.find(x=>x.key===q.category)||{color:"#94a3b8"};
  const t=new Date(q.ts).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"});
  const blk=q.action==="blocked";
  return`<div class="flex items-center gap-3 text-sm py-1">
    <span class="w-2.5 h-2.5 rounded-full flex-none" style="background:${c.color}"></span>
    <span class="flex-1 truncate font-medium ${blk?'text-danger line-through opacity-70':''}">${esc(q.domain)}</span>
    ${blk?`<span class="text-[10px] font-black text-danger bg-danger/10 px-2 py-0.5 rounded-lg">Bloqueado</span>`:''}
    <span class="text-xs text-soft tabular-nums flex-none">${t}</span>
  </div>`;
}
function connectFeedWS(){
  if(WS&&WS.readyState===1)return;
  try{
    const proto=location.protocol==="https:"?"wss":"ws";
    WS=new WebSocket(`${proto}://${location.host}/api/feed/live?token=${TOKEN}`);
    WS.onmessage=e=>{
      const ev=JSON.parse(e.data);
      FEED.unshift(ev);FEED=FEED.slice(0,100);
      const list=$("#flist");if(!list)return;
      if(FEED.length===1)list.innerHTML="";
      const row=h(`<div class="fade">${feedRow(ev)}</div>`);
      list.prepend(row);draw();
      while(list.children.length>100)list.lastChild.remove();
    };
    WS.onclose=()=>{WS=null};
  }catch{}
}

// ── DETALLE DE UN HIJO ────────────────────────────────────────────────────────
let CUR_PID=null;

async function Child(pid){
  CUR_PID=pid;
  let profs,rules;
  try{[profs,rules]=await Promise.all([api("/api/profiles"),api(`/api/profiles/${pid}/rules`)])}catch{return}
  const p=profs.find(x=>x.id==pid);if(!p)return route("home");

  const catSch={};
  rules.forEach(r=>{if(r.scope==="category"&&r.action==="block")catSch[r.value]=r.schedule});
  const bedtimeRule=rules.find(r=>r.scope==="bedtime");
  const bedtime=bedtimeRule?.schedule||null;

  const paused=p.paused_until&&new Date(p.paused_until)>new Date();

  // Botón de pausa grande
  const pauseSection=paused
    ?`<button onclick="doPause(${pid},0)" class="press w-full bg-ok/10 text-ok font-black text-lg py-4 rounded-2xl flex items-center justify-center gap-3">
        ${icon('play','w-6 h-6')} Reanudar internet
      </button>`
    :`<div class="grid grid-cols-3 gap-3">
        ${[15,30,60].map(m=>`<button onclick="doPause(${pid},${m})" class="press bg-ink text-white font-bold py-4 rounded-2xl text-sm flex flex-col items-center gap-1">
          ${icon('pause','w-5 h-5')}<span>Pausar<br/>${m} min</span></button>`).join("")}
      </div>`;

  // Lista de categorías
  const catRows=CATS.filter(ct=>ct.key!=="evasion"&&ct.key!=="other").map(ct=>{
    const on=p.blocked_categories.includes(ct.key);
    const sched=on?(catSch[ct.key]||null):null;
    return`<div class="flex items-center gap-3 py-3 border-b border-line last:border-0">
      <span class="w-3 h-3 rounded-full flex-none" style="background:${ct.color}"></span>
      <span class="flex-1 font-semibold text-base">${esc(ct.label)}</span>
      ${sched?`<button onclick="editSch(${pid},'${ct.key}')" class="press text-xs text-brand font-bold px-2 py-1 bg-brand/10 rounded-xl flex-none">${icon('clock','w-3 h-3 inline')} ${esc(sched.from)}–${esc(sched.to)}</button>`:''}
      <button class="tog ${on?'on':''}" onclick="flipCat(${pid},'${ct.key}',${!on})"></button>
    </div>`;
  }).join("");

  // Hora de dormir
  const sleepCard=`<div class="bg-white rounded-2xl border-2 border-line p-4">
    <div class="flex items-center gap-3 mb-1">
      <span class="text-2xl">🌙</span>
      <div class="flex-1">
        <p class="font-black text-base">Hora de dormir</p>
        <p class="text-sm text-soft">${bedtime?`Bloqueo total: ${esc(schText(bedtime))}`:"Sin horario de sueño"}</p>
      </div>
      <button onclick="editBedtime(${pid})" class="press text-brand font-bold text-sm px-3 py-1.5 bg-brand/10 rounded-xl">
        ${bedtime?'Cambiar':'Configurar'}
      </button>
    </div>
    ${bedtime?`<button onclick="clearBedtime(${pid})" class="press text-sm text-soft mt-1">Desactivar</button>`:''}
  </div>`;

  const content=`
    <div class="text-center mb-6 pt-2">
      <div class="text-6xl mb-2">${p.emoji}</div>
      <h2 class="display font-black text-2xl">${esc(p.name)}</h2>
      <p class="text-soft text-sm mt-1">${p.blocked_categories.length} categorías bloqueadas</p>
    </div>

    <div class="mb-5">${pauseSection}</div>

    <section class="bg-white rounded-2xl border-2 border-line px-4 mb-4">
      <h3 class="display font-black text-lg pt-4 pb-2">Qué puede ver</h3>
      <p class="text-xs text-soft mb-3">Activa el interruptor para bloquear. Toca el horario para cambiarlo.</p>
      ${catRows}
    </section>

    ${sleepCard}
  `;
  shell(content,"home",{back:"home",title:p.emoji+" "+p.name});
}

}
async function flipCat(pid,cat,block){

// ── MODAL DE HORARIO ─────────────────────────────────────────────────────────
function editSch(pid,cat){
  api(`/api/profiles/${pid}/rules`).then(rules=>{
    const r=rules.find(x=>x.scope==="category"&&x.value===cat);
    const s=r?.schedule||{days:[0,1,2,3,4,5,6],from:"20:00",to:"07:00"};
    const catLabel=CATS.find(x=>x.key===cat)?.label||cat;
    showSchModal(`Horario de bloqueo — ${catLabel}`,
      "El contenido solo se bloquea en los días y horas que elijas. Fuera de ese horario, estará disponible.",
      s,
      async sch=>{await api(`/api/profiles/${pid}/category`,{method:"POST",body:JSON.stringify({category:cat,block:true,schedule:sch})});toast("Horario guardado");Child(pid)},
      async ()=>{await api(`/api/profiles/${pid}/category`,{method:"POST",body:JSON.stringify({category:cat,block:true,schedule:null})});toast("Siempre bloqueado");Child(pid)}
    );
  });
}
function editBedtime(pid){
  api(`/api/profiles/${pid}/rules`).then(rules=>{
    const r=rules.find(x=>x.scope==="bedtime");
    const s=r?.schedule||{days:[0,1,2,3,4,5,6],from:"22:00",to:"07:00"};
    showSchModal("Hora de dormir",
      "En este horario se corta todo el internet del hijo, sin excepción.",
      s,
      async sch=>{await api(`/api/profiles/${pid}/bedtime`,{method:"POST",body:JSON.stringify({schedule:sch})});toast("Hora de dormir guardada");Child(pid)},
      async ()=>{await api(`/api/profiles/${pid}/bedtime`,{method:"POST",body:JSON.stringify({schedule:null})});toast("Desactivada");Child(pid)},
      "Desactivar hora de dormir"
    );
  });
}
async function clearBedtime(pid){
  await api(`/api/profiles/${pid}/bedtime`,{method:"POST",body:JSON.stringify({schedule:null})});
  toast("Hora de dormir desactivada");Child(pid);
}

function showSchModal(title,subtitle,s,onSave,onClear,clearLabel="Sin horario (siempre)"){
  let selDays=s.days?[...s.days]:[0,1,2,3,4,5,6];
  const dayBtns=DAY_ES.map((d,i)=>
    `<button data-i="${i}" class="press ddbtn ${selDays.includes(i)?'bg-brand text-white':'bg-mist text-soft'} font-bold text-xs px-3 py-2 rounded-xl border-2 ${selDays.includes(i)?'border-brand':'border-line'}">${d}</button>`
  ).join("");
  const m=h(`<div class="fixed inset-0 z-50 bg-ink/50 flex items-end sm:items-center justify-center p-4 fade" onclick="if(event.target===this)this.remove()">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
      <h3 class="display font-black text-xl mb-1">${esc(title)}</h3>
      <p class="text-sm text-soft mb-5">${esc(subtitle)}</p>
      <p class="text-xs font-black text-soft uppercase tracking-widest mb-2">Días</p>
      <div class="flex flex-wrap gap-2 mb-5">${dayBtns}</div>
      <div class="grid grid-cols-2 gap-3 mb-6">
        <div>
          <label class="text-xs font-black text-soft uppercase tracking-widest block mb-1.5">Desde</label>
          <input type="time" id="sh_f" value="${esc(s.from||'20:00')}" class="w-full px-3 py-3 rounded-xl border-2 border-line outline-none focus:border-brand font-bold text-base">
        </div>
        <div>
          <label class="text-xs font-black text-soft uppercase tracking-widest block mb-1.5">Hasta</label>
          <input type="time" id="sh_t" value="${esc(s.to||'07:00')}" class="w-full px-3 py-3 rounded-xl border-2 border-line outline-none focus:border-brand font-bold text-base">
        </div>
      </div>
      <div class="space-y-2">
        <button id="sh_save" class="press w-full bg-brand text-white font-black text-lg py-3.5 rounded-2xl">Guardar</button>
        <button id="sh_clear" class="press w-full bg-mist text-soft font-bold py-3 rounded-2xl text-sm">${esc(clearLabel)}</button>
        <button onclick="this.closest('.fixed').remove()" class="press w-full text-soft font-bold py-2 rounded-2xl text-sm">Cancelar</button>
      </div>
    </div></div>`);
  document.body.appendChild(m);draw();
  $$(".ddbtn",m).forEach(b=>b.onclick=()=>{
    const i=parseInt(b.dataset.i);
    const idx=selDays.indexOf(i);
    if(idx>-1)selDays.splice(idx,1);else selDays.push(i);
    b.classList.toggle("bg-brand",selDays.includes(i));b.classList.toggle("text-white",selDays.includes(i));
    b.classList.toggle("bg-mist",!selDays.includes(i));b.classList.toggle("text-soft",!selDays.includes(i));
    b.classList.toggle("border-brand",selDays.includes(i));b.classList.toggle("border-line",!selDays.includes(i));
  });
  $("#sh_save",m).onclick=async()=>{m.remove();await onSave({days:selDays,from:$("#sh_f",m)?.value||s.from,to:$("#sh_t",m)?.value||s.to})};
  $("#sh_clear",m).onclick=async()=>{m.remove();await onClear()};
}

// ── DISPOSITIVOS (interno, desde ajustes) ────────────────────────────────────
async function Devices(){
  let devs,profs;try{[devs,profs]=await Promise.all([api("/api/devices"),api("/api/profiles")])}catch{return}
  const g={nuevos:[],asignados:[],ignorados:[]};
  devs.forEach(d=>d.ignored?g.ignorados.push(d):d.profile_id?g.asignados.push(d):g.nuevos.push(d));
  const sel=d=>`<select onchange="devAssign(${d.id},this.value)" class="text-sm border-2 border-line rounded-xl px-2 py-1.5 bg-white font-medium">
      <option value="">Sin asignar</option>
      ${profs.map(p=>`<option value="${p.id}" ${d.profile_id==p.id?'selected':''}>${esc(p.emoji+' '+p.name)}</option>`).join("")}
      <option value="ignore" ${d.ignored?'selected':''}>🚫 Ignorar</option>
    </select>`;
  const card=d=>`<div class="bg-white rounded-2xl border-2 border-line p-4 flex items-center gap-3">
      <div class="text-2xl w-10 h-10 bg-mist rounded-xl flex items-center justify-center flex-none">${icon('smartphone','w-5 h-5 text-soft')}</div>
      <div class="flex-1 min-w-0">
        <input value="${esc(d.label)}" onchange="devRename(${d.id},this.value)" class="font-bold text-sm bg-transparent outline-none w-full truncate">
        <p class="text-xs text-soft">${esc(d.vendor||'')} · ${esc(d.ip)}</p>
      </div>
      ${sel(d)}</div>`;
  const sect=(t,arr)=>arr.length?`<div class="mb-5"><p class="text-xs font-black text-soft uppercase tracking-widest mb-3">${t}</p><div class="space-y-2">${arr.map(card).join("")}</div></div>`:"";
  const ra=`<button onclick="rescan()" class="press p-2 rounded-xl text-brand">${icon('radar','w-6 h-6')}</button>`;
  shell(`<div class="pt-1">
    ${sect("Nuevos por asignar",g.nuevos)}
    ${sect("Asignados",g.asignados)}
    ${sect("Ignorados",g.ignorados)}
    ${devs.length===0?`<div class="text-center py-20"><div class="text-6xl mb-4">📡</div><p class="text-soft text-lg">Toca el radar arriba para buscar dispositivos.</p></div>`:""}
  </div>`,"ajustes",{back:"ajustes",title:"Dispositivos",action:ra});
}
async function rescan(){toast("Buscando…");await api("/api/devices/discover",{method:"POST"});Devices()}
async function devRename(id,label){await api("/api/devices/"+id,{method:"PATCH",body:JSON.stringify({label})});toast("Nombre guardado")}
async function devAssign(id,val){
  if(val==="ignore")await api("/api/devices/"+id,{method:"PATCH",body:JSON.stringify({ignored:true,profile_id:null})});
  else await api("/api/devices/"+id,{method:"PATCH",body:JSON.stringify({profile_id:val?parseInt(val):null,ignored:false})});
  toast("Guardado");Devices();
}

      <input id="em_pw" type="password" placeholder="Clave de aplicación" class="w-full px-4 py-3 rounded-2xl border-2 border-line mb-3 outline-none focus:border-brand text-sm">
      <div class="bg-mist rounded-xl p-3 text-xs text-soft mb-4">Para Gmail: ve a tu cuenta → Seguridad → Contraseñas de aplicación. Usa smtp.gmail.com, puerto 587.</div>
      <button onclick="saveEmail(this)" class="press w-full bg-brand text-white font-black text-lg py-3.5 rounded-2xl mb-2">Guardar</button>
      <button onclick="this.closest('.fixed').remove()" class="press w-full text-soft font-bold py-3 rounded-2xl text-sm">Cancelar</button>
    </div></div>`);
  document.body.appendChild(m);
}
async function saveEmail(btn){
  const to=$("#em_to").value.trim(),host=$("#em_host").value.trim();
  const port=parseInt($("#em_port").value)||587,user=$("#em_user").value.trim(),pw=$("#em_pw").value;
  if(!to||!host||!user||!pw)return toast("Completa todos los campos","warn");
  const extra={host,port,user,password:pw,from:`KidSafe <${user}>`};
  await api("/api/alerts",{method:"POST",body:JSON.stringify({channel:"email",target:to,extra,triggers:"adult,gambling,new_device,evasion"})});
  btn.closest(".fixed").remove();toast("Alerta de email guardada");openAlertas();
}
async function delAlert(id){await api("/api/alerts/"+id,{method:"DELETE"});openAlertas()}

// ── go ───────────────────────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
