[pytest]
# =============================================================================
# pytest.ini — Configuración de la suite de tests de Bit-Counting
# =============================================================================

# Directorio raíz del proyecto
testpaths = tests

# Patrón de descubrimiento de tests
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones por defecto
# Coverage enfocado en los módulos críticos del pipeline (no en tests ni archivos auxiliares)
addopts =
    --tb=short
    --strict-markers
    -q
    --cov=agents.flow
    --cov=agents.auditor
    --cov=agents.clasificador
    --cov=agents.fiscal_pr
    --cov=agents.intake
    --cov=agents.centinela
    --cov=agents.centinela_guardian
    --cov=agents.aprendizaje_federado
    --cov=agents.orchestrator
    --cov=api.auth
    --cov=api.dependencies
    --cov=api.routes.transactions
    --cov=api.routes.cpa_dashboard
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=60

# Markers registrados (evita PytestUnknownMarkWarning)
markers =
    unit:        Tests unitarios de agentes individuales
    integration: Tests de integración end-to-end
    security:    Tests de seguridad y aislamiento de scope
    load:        Tests de carga y concurrencia
    slow:        Tests que toman más de 10 segundos

# Filtros de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pydantic.*
